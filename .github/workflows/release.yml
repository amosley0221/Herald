name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.4.2'
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The branch a release is cut from and pushed back to. `github.event.
  # repository.default_branch` is not reliable here: a repository whose default
  # is still a working branch would have the release land there instead of on
  # the trunk. Override with a RELEASE_BRANCH repository variable if the trunk
  # is not called main.
  RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH || 'main' }}

jobs:
  # ── Cut the notes and publish the feeds every updater reads ───────────────
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.cut.outputs.version }}
      android_version_code: ${{ steps.cut.outputs.android_version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The repository's own default branch, not an assumed "main" — the
          # first release used to fail here on a repo that names it anything
          # else, or has not created it yet.
          ref: ${{ vars.RELEASE_BRANCH || 'main' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build --workspace @herald/core

      - name: Cut the release
        id: cut
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          node scripts/sync-version.mjs "$VERSION"
          node scripts/cut-release.mjs "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "android_version_code=$(node -e "
            import('./packages/core/dist/index.js').then(m =>
              console.log(m.androidVersionCode('$VERSION')))
          ")" >> "$GITHUB_OUTPUT"

      - name: Commit the cut
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md releases package.json packages/*/package.json \
                  services/*/package.json apps/*/package.json \
                  apps/android/version.generated.json \
                  apps/desktop/src-tauri/tauri.conf.json
          git commit -m "Release ${{ steps.cut.outputs.version }}" || echo "Nothing to commit"
          git push origin HEAD:${{ vars.RELEASE_BRANCH || 'main' }}

      - uses: actions/upload-artifact@v4
        with:
          name: releases
          path: releases/

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.cut.outputs.version }}
          name: Herald ${{ steps.cut.outputs.version }}
          body_path: releases/notes.md
          draft: false

  # ── Android: a signed APK, plus an OTA patch when Expo is configured ─────
  android:
    name: Android
    needs: notes
    runs-on: ubuntu-latest
    # A Gradle build that blocks on a prompt would otherwise sit until the
    # six-hour default, and its logs cannot be read until the job ends — so a
    # hang is invisible exactly while you most need to see it. 45 minutes was
    # not enough to tell a wedged build from a merely slow one: this project
    # compiles the New Architecture's generated C++ from cold on the first
    # release, which is long even for one ABI.
    timeout-minutes: 90
    env:
      # `secrets` is not a valid context in a step-level `if`, but it is in job
      # env, so the optional OTA steps test this instead.
      HAS_EXPO: ${{ secrets.EXPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image already ships the Android SDK. `android-actions/
      # setup-android` was only adding an attempt to install the `tools`
      # package, which Google removed from the SDK repository — sdkmanager now
      # exits 1 on it and fails the whole job.
      - name: Accept the Android SDK licences
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdkmanager=$SDKMANAGER"
          # `yes` is killed by SIGPIPE the instant sdkmanager has read the last
          # prompt and exits, and `pipefail` would report that as a failed step
          # even though every licence was accepted. Only sdkmanager's own exit
          # status says whether this worked, so judge the pipeline by it.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          echo "--- platforms ---";    ls "$ANDROID_HOME/platforms"
          echo "--- build-tools ---";  ls "$ANDROID_HOME/build-tools"
          echo "--- ndk ---";          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "(no NDK installed)"

      # Gradle's caches survive between runs, so only the first release pays the
      # full dependency download and native compile.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - run: npm ci --workspace @herald/core --workspace @herald/android --include-workspace-root
      - run: npm run build --workspace @herald/core

      # Generates the native android/ project from app.config.ts. It is not
      # committed, so the build always reflects the current config.
      - name: Generate the native project
        working-directory: apps/android
        env:
          HERALD_RELEASES_INDEX_URL: ${{ vars.HERALD_RELEASES_INDEX_URL }}
          HERALD_RELEASES_PAGE_URL: ${{ vars.HERALD_RELEASES_PAGE_URL }}
          HERALD_DEFAULT_ENGINE_URL: ${{ vars.HERALD_DEFAULT_ENGINE_URL }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          EXPO_UPDATES_URL: ${{ vars.EXPO_UPDATES_URL }}
        run: npx expo prebuild --platform android --no-install

      # Every build must be signed with the same key or Android refuses to
      # install it over the previous one. ANDROID_KEYSTORE_BASE64 holds that key.
      - name: Restore the signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Generate a keystore and add it as a repository secret, or the APK cannot be signed. See README → Cutting a release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > apps/android/android/app/herald.keystore
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        working-directory: apps/android/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Gradle writes to a file, which is streamed from there, rather than
          # down the step's stdout pipe.
          #
          # Gradle forks worker and Kotlin daemon JVMs that inherit whatever
          # stdout it was handed and outlive it, and a step ends when its stdout
          # pipe closes, not when its main process exits. So when Gradle failed
          # after nine minutes, those orphans held the pipe open and the step sat
          # there for the remaining eighty — which read from outside as a hang
          # and cost this release three runs. Handing them a file instead means
          # the step ends when Gradle does.

          # Metaspace, not heap: it is allocated outside -Xmx, so Expo's default
          # -Xmx2048m -XX:MaxMetaspaceSize=512m capped class metadata at 512m no
          # matter how much heap was free. The New Architecture's codegen and
          # Kotlin compilation load far more classes than that, and the build
          # died of `OutOfMemoryError: Metaspace`.
          #
          # Only arm64-v8a. Reanimated and the other native modules compile
          # their C++ once per ABI, and building all four means three quarters
          # of the work is for architectures no real device uses: the x86 pair
          # exists for emulators, and armeabi-v7a for phones predating the
          # 64-bit requirement. Add ABIs back here if an old device needs one.
          ./gradlew assembleRelease --no-daemon --console=plain --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=2g" \
            -PreactNativeArchitectures=arm64-v8a \
            -PHERALD_STORE_FILE=herald.keystore \
            -PHERALD_STORE_PASSWORD="$STORE_PASSWORD" \
            -PHERALD_KEY_ALIAS="$KEY_ALIAS" \
            -PHERALD_KEY_PASSWORD="$KEY_PASSWORD" \
            > gradle.log 2>&1 < /dev/null &
          gradle=$!

          # Stream the build as it runs, and stop the moment Gradle exits.
          tail -n +1 -f --pid="$gradle" gradle.log &
          streamer=$!

          # A timestamped marker every five minutes. Logs only arrive when the
          # job ends, so these are what distinguish a slow build from a stuck
          # one. It follows Gradle's lifetime, so it cannot outlive the build
          # and hold the step open itself.
          (
            started=$(date +%s)
            while kill -0 "$gradle" 2>/dev/null; do
              sleep 60
              kill -0 "$gradle" 2>/dev/null || break
              echo "--- heartbeat: $(( ($(date +%s) - started) / 60 ))m elapsed ---"
            done
          ) &
          heartbeat=$!

          trap 'kill "$streamer" "$heartbeat" 2>/dev/null || true' EXIT

          set +e
          wait "$gradle"
          status=$?
          set -e
          echo "=== Gradle exited with status $status ==="
          exit "$status"

      # The name is what the release feed records and the in-app updater fetches.
      - name: Name the APK for the release
        run: |
          cp apps/android/android/app/build/outputs/apk/release/app-release.apk \
             "herald-${{ needs.notes.outputs.version }}.apk"
          ls -la "herald-${{ needs.notes.outputs.version }}.apk"

      - name: Verify it is signed
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "herald-${{ needs.notes.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: herald-${{ needs.notes.outputs.version }}.apk

      - name: Attach the APK to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.notes.outputs.version }}
          files: herald-${{ needs.notes.outputs.version }}.apk

      # Over-the-air updates are a separate, optional layer: they need an Expo
      # account. Without one the APK above still updates itself through the
      # release feed, so this is skipped rather than failing the release.
      - name: Publish the over-the-air update
        if: env.HAS_EXPO == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Push the OTA bundle
        if: env.HAS_EXPO == 'true'
        working-directory: apps/android
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: eas update --branch production --message "v${{ needs.notes.outputs.version }}" --non-interactive

  # ── Desktop: signed installers plus the updater manifest ─────────────────
  desktop:
    name: Desktop (${{ matrix.label }})
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,  label: linux,   args: '' }
          - { os: windows-latest, label: windows, args: '' }
          - { os: macos-latest,   label: macos,   args: '--target universal-apple-darwin' }
    runs-on: ${{ matrix.os }}
    env:
      # Updater artifacts must be signed, and Tauri fails the build outright if
      # asked to produce them without a key — after the installers are already
      # built. Produce them only when a key exists; without one the app still
      # builds and installs, it just does not self-update.
      UPDATER_CONFIG: >-
        ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != ''
            && '--config {"bundle":{"createUpdaterArtifacts":true}}'
            || '' }}
      # `secrets` is not a valid context in a step-level `if`, but it is here.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.label == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Tauri system dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      # Only the workspaces this job needs. A bare `npm ci` also installs the
      # engine, whose better-sqlite3 has to be compiled from source on Windows
      # and fails there — the desktop app never touches it.
      - run: npm ci --workspace @herald/core --workspace @herald/desktop --include-workspace-root
      - run: npm run build --workspace @herald/core

      # Two near-identical steps, because an Apple certificate cannot be passed
      # conditionally. An unset secret becomes the empty string and the variable
      # is still *defined*, and Tauri decides to codesign on the variable being
      # present rather than on it holding anything — so it ran `security import`
      # on an empty certificate and failed the build after the app was built.
      # The only way to leave a variable undefined is to omit it from the step.
      - name: Build and publish
        if: env.HAS_APPLE_CERT != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update so a compromised host cannot push a build of its own.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v${{ needs.notes.outputs.version }}
          releaseName: Herald ${{ needs.notes.outputs.version }}
          releaseBody: See the release notes.
          releaseDraft: false
          args: ${{ matrix.args }} ${{ env.UPDATER_CONFIG }}

      # The same build, signed and notarized. Gatekeeper blocks an unnotarized
      # update, so macOS self-updating only works down this path.
      - name: Build and publish (signed for macOS)
        if: env.HAS_APPLE_CERT == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: v${{ needs.notes.outputs.version }}
          releaseName: Herald ${{ needs.notes.outputs.version }}
          releaseBody: See the release notes.
          releaseDraft: false
          args: ${{ matrix.args }} ${{ env.UPDATER_CONFIG }}

  # ── Fold the signed platform URLs into the updater manifest ──────────────
  updater-manifest:
    name: Updater manifest
    needs: [notes, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH || 'main' }}

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Assemble latest.json from the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.notes.outputs.version }}
        run: node scripts/build-updater-manifest.mjs "$VERSION"

      - name: Commit the manifest
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add releases/
          git commit -m "Updater manifest for ${{ needs.notes.outputs.version }}" || echo "Nothing to commit"
          git push origin HEAD:${{ vars.RELEASE_BRANCH || 'main' }}

  # ── Publish the release-notes page ───────────────────────────────────────
  pages:
    name: Release notes page
    needs: [notes, updater-manifest]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH || 'main' }}

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - run: npm ci
      - run: npm run build --workspace @herald/core

      - name: Render the page
        run: node scripts/build-releases-page.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: releases

      - id: deploy
        uses: actions/deploy-pages@v4
